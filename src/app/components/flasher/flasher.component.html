<section id="flasher" class="section-padding bg-light-gray">
    <div class="container d-flex justify-content-center">
        <div class="card p-4 p-md-5 text-center shadow-lg rounded-4 w-100" style="max-width: 640px;">
            <div class="mb-4">
                <img src="/flasher/assets/img/sonpakhru-kida-150.png" alt="Sonpakhru Logo" class="logo mx-auto"
                    width="100">
            </div>

            <h2 class="h3 fw-bold text-primary mb-3">Sonpakhru Device Flasher</h2>
            <p class="text-muted mb-4">Select your product type to begin the flashing process:</p>

            <div class="d-flex justify-content-center flex-wrap gap-4 mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type" id="fv86" value="fv-86"
                        (change)="onTypeChange($event)">
                    <label class="form-check-label fw-medium" for="fv86">FactoryVU-66</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type" id="fv32" value="fv-32"
                        (change)="onTypeChange($event)">
                    <label class="form-check-label fw-medium" for="fv32">FactoryVU-32</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type" id="iot" value="iot"
                        (change)="onTypeChange($event)">
                    <label class="form-check-label fw-medium" for="iot">PyroVU</label>
                </div>
            </div>

            <div class="mt-4" [class.d-none]="!showButton">
                <esp-web-install-button #installButton></esp-web-install-button>
            </div>

            <!-- Progress Section -->
            <div class="mt-5" *ngIf="isInstalling || progress > 0 || status">
                <div class="progress" style="height: 12px;" *ngIf="isInstalling || progress > 0">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar"
                        [style.width.%]="progress" [attr.aria-valuenow]="progress" aria-valuemin="0"
                        aria-valuemax="100">
                    </div>
                </div>
                <p class="mt-3 fs-6 fw-medium" [class.text-danger]="error"
                    [class.text-success]="progress === 100 && !error">
                    {{ status }} <span *ngIf="isInstalling">({{ progress }}%)</span>
                </p>
            </div>

            <div class="footer mt-5 text-muted small border-top pt-4">
                © IOCARE 2025 — All Rights Reserved
            </div>
        </div>
    </div>
</section>
