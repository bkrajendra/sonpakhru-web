<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" routerLink="/" fragment="home" (click)="isMenuCollapsed.set(true)">
        <img src="assets/icons/favicon-32x32.png" alt="Sonpakhru" width="30" height="32">
        Sonpakhru
      </a>
      <button class="navbar-toggler" type="button" (click)="isMenuCollapsed.set(!isMenuCollapsed())"
        [attr.aria-expanded]="!isMenuCollapsed()">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" [ngbCollapse]="isMenuCollapsed()">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          @for(link of navLinks; track link.label) {
          <li class="nav-item">
            <a class="nav-link fw-semibold" [routerLink]="link.path" [fragment]="link.fragment"
              (click)="isMenuCollapsed.set(true)">{{ link.label }}</a>
          </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>
