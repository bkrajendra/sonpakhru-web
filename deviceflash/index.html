<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IOCARE Device Flasher</title>

    <!-- ESP Web Tools -->
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@8.0.1/dist/web/install-button.js?module"
    ></script>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #0078d7;
        --secondary: #005fa3;
        --text: #333;
        --bg: #f3f6fa;
        --card-bg: #fff;
        --radius: 14px;
        --shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
      }

      body {
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background: var(--card-bg);
        box-shadow: var(--shadow);
        border-radius: var(--radius);
        padding: 2.2rem 3rem;
        width: 100%;
        max-width: 640px;
        text-align: center;
        transition: transform 0.2s ease;
        animation: fadeIn 0.6s ease-out;
      }

      .card:hover {
        transform: translateY(-3px);
      }

      .logo {
        object-fit: cover;
      }

      h1 {
        font-weight: 600;
        font-size: 1.8rem;
        color: var(--primary);
        margin-bottom: 1rem;
      }

      p {
        margin-bottom: 1.2rem;
        color: #555;
      }

      ul.radios {
        list-style: none;
        display: flex;
        justify-content: center;
        margin-bottom: 1.5rem;
      }

      ul.radios li {
        margin: 0 0.8rem;
      }

      label {
        cursor: pointer;
        font-weight: 500;
      }

      input[type='radio'] {
        margin-right: 0.4rem;
        accent-color: var(--primary);
      }

      esp-web-install-button {
        --esp-tools-button-color: var(--primary);
        --esp-tools-button-border-radius: 10px;
        --esp-tools-button-padding: 0.8em 1.5em;
        --esp-tools-button-font-weight: 600;
        --esp-tools-button-font-size: 1rem;
        --esp-tools-button-hover-color: var(--secondary);
      }

      .invisible {
        display: none;
      }

      .progress-container {
        width: 100%;
        height: 10px;
        background-color: #e6e6e6;
        border-radius: 6px;
        margin-top: 1.5rem;
        overflow: hidden;
        display: none;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background-color: var(--primary);
        transition: width 0.2s ease;
      }

      .progress-text {
        margin-top: 0.6rem;
        font-size: 0.9rem;
        color: #555;
        display: none;
      }

      .footer {
        margin-top: 2rem;
        font-size: 0.85rem;
        color: #999;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <img
        src="/assets/img/sonpakhru-kida-150.png"
        alt="IOCARE Logo"
        class="logo"
      />

      <h1>Sonpakhru Device Flasher</h1>
      <p>Select your product type to begin:</p>

      <ul class="radios">
        <li><label><input type="radio" name="type" value="fv-86" /> FactoryVU-66</label></li>
        <li><label><input type="radio" name="type" value="fv-32" /> FactoryVU-32</label></li>
        <li><label><input type="radio" name="type" value="iot" /> PyroVU</label></li>
      </ul>

      <esp-web-install-button class="invisible"></esp-web-install-button>

      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      <div class="progress-text">Flashing in progress: <span id="progress-value">0</span>%</div>

      <div class="footer">© IOCARE 2025 — All Rights Reserved</div>
    </div>

    <script>
      const radios = document.querySelectorAll('input[name="type"]');
      const installButton = document.querySelector('esp-web-install-button');
      const progressContainer = document.querySelector('.progress-container');
      const progressBar = document.querySelector('.progress-bar');
      const progressText = document.querySelector('.progress-text');
      const progressValue = document.getElementById('progress-value');

      // Radio button logic
      radios.forEach((radio) =>
        radio.addEventListener('change', () => {
          installButton.manifest = `./manifest_${radio.value}.json`;
          installButton.classList.remove('invisible');
        })
      );

      // Progress tracking
      installButton.addEventListener('installing', (e) => {
        progressContainer.style.display = 'block';
        progressText.style.display = 'block';
      });

      installButton.addEventListener('progress', (e) => {
        const percent = Math.round((e.detail.bytesWritten / e.detail.bytesTotal) * 100);
        progressBar.style.width = percent + '%';
        progressValue.textContent = percent;
      });

      installButton.addEventListener('installed', () => {
        progressBar.style.width = '100%';
        progressValue.textContent = '100';
        progressText.textContent = '✅ Flash completed successfully!';
      });

      installButton.addEventListener('error', () => {
        progressText.textContent = '❌ Error during flashing!';
        progressText.style.color = 'red';
      });
    </script>
  </body>
</html>
